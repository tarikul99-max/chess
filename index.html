<script>
    // FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyA6c69hOzq8eauL3lQoY2QkCKXm47RD09E",
        authDomain: "multiple-mass.firebaseapp.com",
        databaseURL: "https://multiple-mass-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "multiple-mass",
        storageBucket: "multiple-mass.firebasestorage.app",
        messagingSenderId: "1042463319969",
        appId: "1:1042463319969:web:254ebce8ef503ecacecde0",
        measurementId: "G-57SY5V1XKD"
    };

    let db = null;
    let firebaseReady = false;
    let firebaseErrorMsg = '';

    function updateFirebaseStatus(status, msg) {
        const statusEl = document.getElementById('fbStatusText');
        const iconEl = document.querySelector('#firebaseStatus i');
        if (!statusEl) return;
        statusEl.textContent = msg;
        if (iconEl) {
            if (status === 'ok') iconEl.className = 'fa-solid fa-circle text-emerald-400 text-[8px] mr-1';
            else if (status === 'error') iconEl.className = 'fa-solid fa-circle text-rose-400 text-[8px] mr-1';
            else iconEl.className = 'fa-solid fa-circle text-amber-400 text-[8px] mr-1';
        }
    }

    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        firebaseReady = true;
        updateFirebaseStatus('ok', 'Firebase সংযুক্ত ✓');
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) updateFirebaseStatus('ok', 'Firebase সংযুক্ত ✓');
            else updateFirebaseStatus('pending', 'Firebase সংযোগ বিচ্ছিন্ন');
        });
    } catch (e) {
        firebaseReady = false;
        firebaseErrorMsg = e.message;
        updateFirebaseStatus('error', 'Firebase init ব্যর্থ');
    }

    // APP STATE
    let currentMessId = null;
    let currentMessMeta = null;
    let isAdmin = false;
    let pendingAdminCallback = null;
    let isRemoteUpdate = false;
    let currentListenerRef = null;

    let messDetails = { name: "মেস মিল ও হিসাব সিস্টেম" };
    let selectedMonth = new Date().toISOString().slice(0, 7);
    let members = [];
    let mealsData = {};
    let depositData = [];
    let bazarData = [];
    let polls = {};   // { "YYYY-MM-DD": { m: {votes:{id:qty}}, l: {...}, d: {...} } }

    // Vote modal state
    let pendingVote = null; // { dateStr, mealType, memberId, voteValue }

    const bnMonths = {
        "01": "জানুয়ারি", "02": "ফেব্রুয়ারি", "03": "মার্চ", "04": "এপ্রিল",
        "05": "মে", "06": "জুন", "07": "জুলাই", "08": "আগস্ট",
        "09": "সেপ্টেম্বর", "10": "অক্টোবর", "11": "নভেম্বর", "12": "ডিসেম্বর"
    };
    const bnDays = ["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"];

    function showJusticeModal() { const m = document.getElementById('justiceModal'); if (m) m.classList.remove('hidden'); }
    function closeJusticeModal() { const m = document.getElementById('justiceModal'); if (m) m.classList.add('hidden'); }

    window.onload = function() {
        if (localStorage.getItem('mess_theme') === 'dark') {
            document.documentElement.classList.add('dark');
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = "fa-solid fa-sun text-base text-amber-400";
        }

        const pdp = document.getElementById('pollDatePicker');
        if (pdp) pdp.value = new Date().toISOString().slice(0, 10);

        const savedMessId = localStorage.getItem('current_mess_id');
        const savedViewPwd = localStorage.getItem('current_mess_viewpwd');
        const savedAdminPwd = localStorage.getItem('current_mess_adminpwd');
        const savedIsAdmin = localStorage.getItem('current_mess_isadmin') === 'true';

        if (savedMessId && savedViewPwd && firebaseReady) {
            attemptJoinMess(savedMessId, savedViewPwd, savedAdminPwd, savedIsAdmin, true);
        } else {
            showLoginScreen();
        }

        setTimeout(() => showJusticeModal(), 800);
    };

    function showLoginScreen() {
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('mainApp').classList.add('hidden');
    }
    function showMainApp() {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
    }
    function showLoginTab(tab) {
        const joinTab = document.getElementById('tabLoginJoin');
        const createTab = document.getElementById('tabLoginCreate');
        const joinForm = document.getElementById('joinForm');
        const createForm = document.getElementById('createForm');
        if (tab === 'join') {
            joinTab.className = "flex-1 py-2 rounded-lg text-[11px] sm:text-xs font-bold transition bg-white dark:bg-slate-900 text-emerald-600 shadow-sm";
            createTab.className = "flex-1 py-2 rounded-lg text-[11px] sm:text-xs font-bold transition text-slate-600 dark:text-slate-400";
            joinForm.classList.remove('hidden');
            createForm.classList.add('hidden');
        } else {
            createTab.className = "flex-1 py-2 rounded-lg text-[11px] sm:text-xs font-bold transition bg-white dark:bg-slate-900 text-indigo-600 shadow-sm";
            joinTab.className = "flex-1 py-2 rounded-lg text-[11px] sm:text-xs font-bold transition text-slate-600 dark:text-slate-400";
            createForm.classList.remove('hidden');
            joinForm.classList.add('hidden');
        }
        hideLoginError();
    }
    function showLoginError(msg) {
        const box = document.getElementById('loginError');
        document.getElementById('loginErrorMsg').textContent = msg;
        box.classList.remove('hidden');
        setTimeout(() => box.classList.add('hidden'), 10000);
    }
    function hideLoginError() { document.getElementById('loginError').classList.add('hidden'); }

    function handleJoinMess(e) {
        e.preventDefault();
        hideLoginError();
        const messId = document.getElementById('joinMessId').value.trim().toLowerCase();
        const viewPwd = document.getElementById('joinPassword').value;
        if (!messId || !viewPwd) { showLoginError('❌ Mess ID এবং পাসওয়ার্ড দিন'); return; }
        if (!firebaseReady || !db) { showLoginError('❌ Firebase সংযোগ নেই'); return; }
        attemptJoinMess(messId, viewPwd, null, false, false);
    }

    function attemptJoinMess(messId, viewPwd, adminPwd, wasAdmin, silent) {
        db.ref(`messes/${messId}/meta`).once('value').then(snapshot => {
            const meta = snapshot.val();
            if (!meta) { if (!silent) showLoginError('❌ Mess ID খুঁজে পাওয়া যায়নি!'); else showLoginScreen(); return; }
            if (meta.viewPassword !== viewPwd) { if (!silent) showLoginError('❌ পাসওয়ার্ড ভুল!'); else showLoginScreen(); return; }
            currentMessId = messId;
            currentMessMeta = meta;
            isAdmin = wasAdmin && adminPwd === meta.adminPassword;
            localStorage.setItem('current_mess_id', messId);
            localStorage.setItem('current_mess_viewpwd', viewPwd);
            localStorage.setItem('current_mess_adminpwd', isAdmin ? adminPwd : '');
            localStorage.setItem('current_mess_isadmin', isAdmin ? 'true' : 'false');
            enterMess(messId, meta);
        }).catch(err => {
            if (!silent) showLoginError('❌ সংযোগে সমস্যা: ' + err.message);
            else showLoginScreen();
        });
    }

    function handleCreateMess(e) {
        e.preventDefault();
        hideLoginError();
        const messId = document.getElementById('createMessId').value.trim().toLowerCase();
        const messName = document.getElementById('createMessName').value.trim();
        const viewPwd = document.getElementById('createViewPassword').value;
        const adminPwd = document.getElementById('createAdminPassword').value;
        if (!/^[a-z0-9\-]{3,30}$/.test(messId)) { showLoginError('❌ Mess ID: ৩-৩০ অক্ষর (a-z, 0-9, -)'); return; }
        if (!messName) { showLoginError('❌ মেসের নাম দিন'); return; }
        if (!viewPwd || viewPwd.length < 3) { showLoginError('❌ View Password কমপক্ষে ৩ অক্ষর'); return; }
        if (!adminPwd || adminPwd.length < 4) { showLoginError('❌ Admin Password কমপক্ষে ৪ অক্ষর'); return; }
        if (!firebaseReady || !db) { showLoginError('❌ Firebase সংযোগ নেই'); return; }

        db.ref(`messes/${messId}/meta`).once('value').then(snapshot => {
            if (snapshot.exists()) { showLoginError('❌ এই Mess ID আগেই ব্যবহৃত!'); throw new Error('MESS_EXISTS'); }
            const newMeta = { name: messName, viewPassword: viewPwd, adminPassword: adminPwd, createdAt: Date.now() };
            const initialData = {
                meta: newMeta,
                data: {
                    messDetails: { name: messName },
                    members: [
                        { id: 'm1', name: 'সদস্য ১', phone: '', color: 'bg-indigo-600', offSchedule: { m: false, l: false, d: false } },
                        { id: 'm2', name: 'সদস্য ২', phone: '', color: 'bg-emerald-600', offSchedule: { m: false, l: false, d: false } }
                    ],
                    mealsData: {},
                    depositData: [],
                    bazarData: [],
                    polls: {}
                }
            };
            return db.ref(`messes/${messId}`).set(initialData).then(() => newMeta);
        }).then((newMeta) => {
            currentMessId = messId;
            currentMessMeta = newMeta;
            isAdmin = true;
            localStorage.setItem('current_mess_id', messId);
            localStorage.setItem('current_mess_viewpwd', newMeta.viewPassword);
            localStorage.setItem('current_mess_adminpwd', newMeta.adminPassword);
            localStorage.setItem('current_mess_isadmin', 'true');
            showToast('✅ নতুন মেস তৈরি হয়েছে!');
            enterMess(messId, newMeta);
        }).catch(err => {
            if (err.message === 'MESS_EXISTS') return;
            showLoginError('❌ মেস তৈরি ব্যর্থ: ' + err.message);
        });
    }

    function enterMess(messId, meta) {
        messDetails = { name: meta.name };
        document.getElementById('headerMessId').textContent = messId;
        document.getElementById('headerMonthText').textContent = getBengaliMonthYear(selectedMonth);
        const mp = document.getElementById('monthPicker');
        if (mp) mp.value = selectedMonth;
        updateAdminUI();
        showMainApp();
        startMessSync(messId);
        setTimeout(() => showJusticeModal(), 1000);
    }

    function startMessSync(messId) {
        if (currentListenerRef) currentListenerRef.off();
        updateSyncBadge('connecting');
        currentListenerRef = db.ref(`messes/${messId}/data`);
        currentListenerRef.on('value', (snapshot) => {
            const data = snapshot.val();
            isRemoteUpdate = true;
            if (!data) { isRemoteUpdate = false; updateSyncBadge('live'); return; }

            if (data.messDetails) messDetails = data.messDetails;
            if (Array.isArray(data.members)) members = data.members;
            if (data.mealsData) mealsData = data.mealsData;
            if (Array.isArray(data.depositData)) depositData = data.depositData;
            if (Array.isArray(data.bazarData)) bazarData = data.bazarData;
            if (data.polls && typeof data.polls === 'object') polls = data.polls;
            else polls = {};

            members.forEach(m => {
                if (!m.offSchedule) m.offSchedule = { m: false, l: false, d: false };
            });

            document.getElementById('headerMessName').textContent = messDetails.name || currentMessMeta.name;
            document.getElementById('headerMonthText').textContent = getBengaliMonthYear(selectedMonth);

            renderAll();
            updateSyncBadge('live');
            isRemoteUpdate = false;
        }, (error) => {
            updateSyncBadge('offline');
            isRemoteUpdate = false;
        });
    }

    function pushDataToFirebase() {
        if (!firebaseReady || !currentMessId || isRemoteUpdate) return;
        db.ref(`messes/${currentMessId}/data`).set({
            messDetails, members, mealsData, depositData, bazarData,
            polls, lastUpdated: Date.now()
        }).catch(err => console.error('Push error:', err));
    }

    function logoutFromMess() {
        if (!confirm('মেস থেকে বের হতে চান?')) return;
        if (currentListenerRef) currentListenerRef.off();
        localStorage.removeItem('current_mess_id');
        localStorage.removeItem('current_mess_viewpwd');
        localStorage.removeItem('current_mess_adminpwd');
        localStorage.removeItem('current_mess_isadmin');
        currentMessId = null; currentMessMeta = null; isAdmin = false;
        members = []; mealsData = {}; depositData = []; bazarData = []; polls = {};
        document.getElementById('joinForm').reset();
        document.getElementById('createForm').reset();
        showLoginTab('join');
        showLoginScreen();
        showToast('লগআউট সম্পন্ন', 'info');
    }

    function updateSyncBadge(status) {
        const icon = document.getElementById('syncIcon');
        const text = document.getElementById('syncText');
        if (!icon || !text) return;
        if (status === 'live') { icon.className = "fa-solid fa-cloud text-emerald-400 pulse-live"; text.textContent = "লাইভ"; }
        else if (status === 'offline') { icon.className = "fa-solid fa-cloud-slash text-rose-400"; text.textContent = "অফলাইন"; }
        else { icon.className = "fa-solid fa-cloud text-amber-400"; text.textContent = "সংযোগ..."; }
    }

    function toggleAdminAuth() {
        if (isAdmin) {
            isAdmin = false;
            localStorage.setItem('current_mess_isadmin', 'false');
            updateAdminUI();
            showToast('ভিউয়ার মোড', 'info');
        } else {
            document.getElementById('adminPinInput').value = '';
            document.getElementById('adminModal').classList.remove('hidden');
        }
    }
    function closeAdminModal() { document.getElementById('adminModal').classList.add('hidden'); pendingAdminCallback = null; }
    function verifyAdminPin() {
        const inputPin = document.getElementById('adminPinInput').value;
        if (!currentMessMeta) return;
        if (inputPin === currentMessMeta.adminPassword) {
            isAdmin = true;
            localStorage.setItem('current_mess_isadmin', 'true');
            localStorage.setItem('current_mess_adminpwd', inputPin);
            updateAdminUI();
            closeAdminModal();
            showToast('এডমিন লগইন সফল!');
            if (pendingAdminCallback) { const cb = pendingAdminCallback; pendingAdminCallback = null; cb(); }
        } else showToast('ভুল পাসওয়ার্ড!', 'error');
    }
    function requireAdmin(callback) {
        if (isAdmin) callback();
        else {
            pendingAdminCallback = callback;
            document.getElementById('adminPinInput').value = '';
            document.getElementById('adminModal').classList.remove('hidden');
        }
    }
    function updateAdminUI() {
        const statusText = document.getElementById('adminStatusText');
        const icon = document.getElementById('adminIcon');
        const authBtnText = document.getElementById('authBtnText');
        const badge = document.getElementById('adminBadge');
        if (isAdmin) {
            statusText.textContent = "এডমিন মোড";
            icon.className = "fa-solid fa-lock-open text-emerald-400";
            authBtnText.textContent = "লগআউট এডমিন";
            badge.className = "flex items-center gap-1.5 bg-emerald-950/90 text-emerald-300 border border-emerald-500/40 text-xs px-3 py-1.5 rounded-full font-semibold";
        } else {
            statusText.textContent = "ভিউয়ার মোড";
            icon.className = "fa-solid fa-lock text-amber-400";
            authBtnText.textContent = "এডমিন লগইন";
            badge.className = "flex items-center gap-1.5 bg-slate-800 text-amber-300 border border-amber-400/30 text-xs px-3 py-1.5 rounded-full font-semibold";
        }
    }

    function toggleDarkMode() {
        const html = document.documentElement;
        const icon = document.getElementById('themeIcon');
        if (html.classList.contains('dark')) {
            html.classList.remove('dark'); html.classList.add('light');
            icon.className = "fa-solid fa-moon text-base";
            localStorage.setItem('mess_theme', 'light');
        } else {
            html.classList.remove('light'); html.classList.add('dark');
            icon.className = "fa-solid fa-sun text-base text-amber-400";
            localStorage.setItem('mess_theme', 'dark');
        }
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('text-indigo-600', 'dark:text-indigo-400', 'bg-indigo-50', 'dark:bg-indigo-950/60', 'border', 'border-indigo-200', 'dark:border-indigo-800');
            btn.classList.add('text-slate-600', 'dark:text-slate-400');
        });
        document.getElementById(`content-${tabName}`).classList.remove('hidden');
        const activeBtn = document.getElementById(`tab-${tabName}`);
        activeBtn.classList.add('text-indigo-600', 'dark:text-indigo-400', 'bg-indigo-50', 'dark:bg-indigo-950/60', 'border', 'border-indigo-200', 'dark:border-indigo-800');
        activeBtn.classList.remove('text-slate-600', 'dark:text-slate-400');

        if (tabName === 'polls') renderPollsTab();
    }

    function getDaysInMonth(yearMonthStr) {
        const [year, month] = yearMonthStr.split('-').map(Number);
        return new Date(year, month, 0).getDate();
    }
    function getBengaliMonthYear(yearMonthStr) {
        if (!yearMonthStr) return '-';
        const [y, m] = yearMonthStr.split('-');
        return `${bnMonths[m] || m} ${y}`;
    }
    function formatBengaliDate(dateStr) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dateObj = new Date(y, m - 1, d);
        return `${d} ${bnMonths[String(m).padStart(2,'0')]} ${y}, ${bnDays[dateObj.getDay()]}`;
    }
    function changeActiveMonth(monthVal) {
        if (!monthVal) return;
        selectedMonth = monthVal;
        document.getElementById('headerMonthText').textContent = getBengaliMonthYear(selectedMonth);
        renderAll();
        showToast(`মাস: ${getBengaliMonthYear(selectedMonth)}`);
    }
    function goToToday() {
        const today = new Date().toISOString().slice(0, 10);
        document.getElementById('pollDatePicker').value = today;
        renderPollsTab();
    }

    function calculateStats() {
        const daysInMonth = getDaysInMonth(selectedMonth);
        let memberMealTotals = {};
        let grandTotalMeals = 0;
        members.forEach(m => memberMealTotals[m.id] = 0);

        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${selectedMonth}-${String(day).padStart(2, '0')}`;
            if (mealsData[dateStr]) {
                members.forEach(m => {
                    if (mealsData[dateStr][m.id]) {
                        const { m: morning = 0, l: noon = 0, d: night = 0 } = mealsData[dateStr][m.id];
                        const sum = (Number(morning) || 0) + (Number(noon) || 0) + (Number(night) || 0);
                        memberMealTotals[m.id] += sum;
                        grandTotalMeals += sum;
                    }
                });
            }
        }

        let memberDepositTotals = {};
        let grandTotalDeposit = 0;
        members.forEach(m => memberDepositTotals[m.id] = 0);
        depositData.filter(item => item.date && item.date.startsWith(selectedMonth)).forEach(item => {
            const amt = Number(item.amount) || 0;
            if (memberDepositTotals[item.memberId] !== undefined) memberDepositTotals[item.memberId] += amt;
            grandTotalDeposit += amt;
        });

        let grandTotalBazar = 0;
        bazarData.filter(item => item.date && item.date.startsWith(selectedMonth)).forEach(item => {
            grandTotalBazar += (Number(item.amount) || 0);
        });

        const mealRate = grandTotalMeals > 0 ? (grandTotalBazar / grandTotalMeals) : 0;
        return { daysInMonth, memberMealTotals, grandTotalMeals, memberDepositTotals, grandTotalDeposit, grandTotalBazar, mealRate };
    }

    function renderAll() {
        renderMealSheet();
        renderMembersDirectory();
        renderScheduleTab();
        renderPollsTab();
        renderDepositTab();
        renderBazarTab();
        renderSummaryTab();
        updateTopMetrics();
    }

    function updateTopMetrics() {
        const stats = calculateStats();
        document.getElementById('totalMessMeals').textContent = stats.grandTotalMeals.toFixed(2);
        document.getElementById('totalMessDeposit').textContent = stats.grandTotalDeposit.toLocaleString('bn-BD');
        document.getElementById('totalMessBazar').textContent = stats.grandTotalBazar.toLocaleString('bn-BD');
        document.getElementById('currentMealRate').textContent = stats.mealRate.toFixed(2);
    }

    function setCategorySuggestion(name) { document.getElementById('bazarCategory').value = name; }

    // MEAL SHEET
    function renderMealSheet() {
        const stats = calculateStats();
        const daysCount = stats.daysInMonth;
        const headerRow = document.getElementById('tableHeader');
        let headerHTML = `<th class="p-3 border border-slate-200 dark:border-slate-800 sticky left-0 bg-slate-100 dark:bg-slate-800 z-30 min-w-[120px]">তারিখ</th>`;

        members.forEach(member => {
            const totalM = stats.memberMealTotals[member.id] || 0;
            const initials = (member.name || '?').trim().charAt(0);
            headerHTML += `
                <th class="p-2 border border-slate-200 dark:border-slate-800 text-center min-w-[135px] bg-slate-100 dark:bg-slate-800/80">
                    <div class="flex flex-col items-center justify-center gap-1 py-1">
                        <div class="w-7 h-7 rounded-full ${member.color || 'bg-indigo-600'} text-white font-bold flex items-center justify-center text-xs shadow-sm">${initials}</div>
                        <span class="font-bold text-slate-800 dark:text-slate-100 text-xs truncate max-w-[120px]">${member.name}</span>
                        <span class="text-[10px] bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 font-extrabold px-2 py-0.5 rounded-full border border-indigo-200 dark:border-indigo-800">মোট: ${totalM.toFixed(2)}</span>
                    </div>
                </th>`;
        });

        headerHTML += `<th class="p-3 border border-slate-200 dark:border-slate-800 text-center min-w-[110px] bg-indigo-100/70 dark:bg-indigo-950/80 font-bold text-indigo-900 dark:text-indigo-200">দৈনিক মোট</th>`;
        headerRow.innerHTML = headerHTML;

        const tbody = document.getElementById('mealTableBody');
        let bodyHTML = '';
        for (let day = 1; day <= daysCount; day++) {
            const dateStr = `${selectedMonth}-${String(day).padStart(2, '0')}`;
            let dailyTotalMealSum = 0;
            bodyHTML += `<tr>`;
            bodyHTML += `<td class="p-2 font-semibold text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-800 sticky left-0 bg-slate-50 dark:bg-slate-900 z-10 shadow-sm text-center"><span class="text-xs font-bold">${day}</span></td>`;

            members.forEach(member => {
                const dayData = (mealsData[dateStr] && mealsData[dateStr][member.id]) || { m: 0, l: 0, d: 0 };
                const cellSum = (Number(dayData.m) || 0) + (Number(dayData.l) || 0) + (Number(dayData.d) || 0);
                dailyTotalMealSum += cellSum;

                bodyHTML += `
                    <td class="p-1 border border-slate-200 dark:border-slate-800 text-center hover:bg-slate-50 dark:hover:bg-slate-800/40 transition">
                        <div class="flex items-center justify-center gap-1 text-[10px]">
                            <div class="flex-1 bg-yellow-50 dark:bg-yellow-950/40 p-0.5 rounded border border-yellow-200 dark:border-yellow-800/50">
                                <span class="text-yellow-700 dark:text-yellow-400 font-bold block text-[9px]">স</span>

        document.getElementById('editMemberId').value = member.id;

    function saveMember() {
        const id = document.getElementById('editMemberId').value;
        const name = document.getElementById('newMemberName').value.trim();
        const phone = document.getElementById('newMemberPhone').value.trim();
        const color = document.getElementById('newMemberColor').value;
        if (!name) { showToast('নাম লিখুন!', 'error'); return; }

        if (id) {
            const member = members.find(m => m.id === id);
            if (member) { member.name = name; member.phone = phone; member.color = color; }
            showToast('মেম্বার আপডেট');
        } else {

            members.push({ id: newId, name, phone, color, offSchedule: { m: false, l: false, d: false } });
            showToast('✅ নতুন মেম্বার যোগ হয়েছে!');

        closeMemberModal();

    function toggleOffSchedule(memberId, mealType) {
        const member = members.find(m => m.id === memberId);
        if (member) {
            if (!member.offSchedule) member.offSchedule = { m: false, l: false, d: false };
            member.offSchedule[mealType] = !member.offSchedule[mealType];
            pushDataToFirebase();
            renderScheduleTab();
            showToast('আপডেট');
        }
    }
    function applyBulkMealOff(memberId) {
        const member = members.find(m => m.id === memberId);
        if (!member) return;
        const daysCount = getDaysInMonth(selectedMonth);
        const { m: offM, l: offL, d: offD } = member.offSchedule || { m: false, l: false, d: false };
        for (let day = 1; day <= daysCount; day++) {
            const dateStr = `${selectedMonth}-${String(day).padStart(2, '0')}`;
            if (!mealsData[dateStr]) mealsData[dateStr] = {};
            if (!mealsData[dateStr][memberId]) mealsData[dateStr][memberId] = { m: 1, l: 1, d: 1 };
            if (offM) mealsData[dateStr][memberId].m = 0;
            if (offL) mealsData[dateStr][memberId].l = 0;
            if (offD) mealsData[dateStr][memberId].d = 0;
        }
        pushDataToFirebase();
        renderAll();
        showToast(`${member.name}-এর জন্য অ্যাপ্লাই!`);
    }

    // 🗳️ DAILY POLLS
    function getPollForDate(dateStr) {
        if (!polls[dateStr]) {
            polls[dateStr] = { m: { votes: {} }, l: { votes: {} }, d: { votes: {} } };
        }
        if (!polls[dateStr].m) polls[dateStr].m = { votes: {} };
        if (!polls[dateStr].l) polls[dateStr].l = { votes: {} };
        if (!polls[dateStr].d) polls[dateStr].d = { votes: {} };
        if (!polls[dateStr].m.votes) polls[dateStr].m.votes = {};
        if (!polls[dateStr].l.votes) polls[dateStr].l.votes = {};
        if (!polls[dateStr].d.votes) polls[dateStr].d.votes = {};
        return polls[dateStr];
    }

    // 🍽️ Vote + Quantity Modal — ONLY ADMIN
    function openVoteQtyModal(dateStr, mealType, memberId, voteValue) {
        // 🔒 Check admin permission
        if (!isAdmin) {
            showToast('🔒 ভোট দিতে এডমিন লগইন করুন', 'error');

                // After admin login, reopen the vote modal

            };
            document.getElementById('adminPinInput').value = '';
            document.getElementById('adminModal').classList.remove('hidden');
            return;
        }

        const member = members.find(m => m.id === memberId);
        if (!member) return;

        pendingVote = { dateStr, mealType, memberId, voteValue };

        const mealNames = { m: 'সকালের মিল', l: 'দুপুরের মিল', d: 'রাতের মিল' };
        const mealName = mealNames[mealType];
        const modal = document.getElementById('voteQtyModal');
        const iconWrap = document.getElementById('voteQtyIconWrap');
        const icon = document.getElementById('voteQtyIcon');

        if (voteValue) {
            iconWrap.className = "w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-2 text-2xl shadow-inner bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400";

            document.getElementById('voteQtyTitle').textContent = `${member.name} — হ্যাঁ`;
            document.getElementById('voteQtySubtitle').textContent = `${mealName} · কত মিল খাবেন?`;

            document.getElementById('voteQtyInput').parentElement.style.display = 'block';
            document.querySelectorAll('#voteQtyModal .meal-qty-btn').forEach(b => b.classList.remove('selected'));
            const btns = document.querySelectorAll('#voteQtyModal .meal-qty-btn');
            btns.forEach(b => {
                if (b.textContent.trim() === '1') b.classList.add('selected');
            });
        } else {
            iconWrap.className = "w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-2 text-2xl shadow-inner bg-rose-100 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400";
            icon.className = "fa-solid fa-xmark";
            document.getElementById('voteQtyTitle').textContent = `${member.name} — না`;
            document.getElementById('voteQtySubtitle').textContent = `${mealName} · খাবেন না (0 মিল)`;
            document.getElementById('voteQtyInput').value = 0;
            document.getElementById('voteQtyInput').parentElement.style.display = 'none';
            document.querySelectorAll('#voteQtyModal .meal-qty-btn').forEach(b => b.classList.remove('selected'));
        }

        modal.classList.remove('hidden');
    }

    function selectQty(val) {
        document.getElementById('voteQtyInput').value = val;
        document.querySelectorAll('#voteQtyModal .meal-qty-btn').forEach(b => b.classList.remove('selected'));
        event.target.classList.add('selected');
    }

    function closeVoteQtyModal() {
        document.getElementById('voteQtyModal').classList.add('hidden');
        pendingVote = null;
    }

    function confirmVoteWithQty() {
        if (!pendingVote) return;
        // Double-check admin
        if (!isAdmin) {
            closeVoteQtyModal();
            showToast('🔒 ভোট দিতে এডমিন লগইন করুন', 'error');
            return;
        }

        const { dateStr, mealType, memberId, voteValue } = pendingVote;
        let qty;
        if (voteValue === false) {
            qty = 0;
        } else {
            qty = parseFloat(document.getElementById('voteQtyInput').value) || 1;
            if (qty < 0) qty = 0;
        }

        const poll = getPollForDate(dateStr);
        poll[mealType].votes[memberId] = qty;

        // Auto update meal sheet
        if (!mealsData[dateStr]) mealsData[dateStr] = {};
        if (!mealsData[dateStr][memberId]) mealsData[dateStr][memberId] = { m: 0, l: 0, d: 0 };
        mealsData[dateStr][memberId][mealType] = qty;

        pushDataToFirebase();
        closeVoteQtyModal();
        renderPollsTab();
        renderMealSheet();
        updateTopMetrics();

        const member = members.find(m => m.id === memberId);
        if (qty > 0) {
            showToast(`✅ ${member?.name} — ${qty} মিল ভোট রেকর্ড`);
        } else {
            showToast(`❌ ${member?.name} — খাবেন না (0 মিল)`);
        }
    }

    // DEPOSIT
    function renderDepositTab() {
        const select = document.getElementById('depositMemberSelect');
        if (select) select.innerHTML = members.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
        const editSelect = document.getElementById('editDepositMemberSelect');
        if (editSelect) editSelect.innerHTML = members.map(m => `<option value="${m.id}">${m.name}</option>`).join('');

        const currentDeposits = depositData.filter(item => item.date && item.date.startsWith(selectedMonth));
        const listTable = document.getElementById('depositListTable');
        let sum = 0;
        if (currentDeposits.length === 0) {
            listTable.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">এই মাসে কোনো জমা নেই</td></tr>`;
        } else {
            listTable.innerHTML = currentDeposits.map(item => {
                const member = members.find(m => m.id === item.memberId) || { name: 'অজানা' };
                sum += Number(item.amount) || 0;
                return `
                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition">
                        <td class="p-3 font-medium text-slate-700 dark:text-slate-300">${item.date}</td>
                        <td class="p-3 font-semibold text-slate-800 dark:text-slate-100">${member.name}</td>
                        <td class="p-3 text-slate-600 dark:text-slate-400">${item.note || '-'}</td>
                        <td class="p-3 font-bold text-emerald-600 dark:text-emerald-400 text-right">৳${Number(item.amount).toLocaleString('bn-BD')}</td>
                        <td class="p-3 text-center">
                            <div class="flex items-center justify-center gap-1.5">
                                <button onclick="requireAdmin(() => openEditDepositModal('${item.id}'))" class="text-indigo-600 hover:text-indigo-800 hover:bg-indigo-50 dark:hover:bg-indigo-950 p-1.5 rounded-lg transition"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button onclick="requireAdmin(() => deleteDeposit('${item.id}'))" class="text-rose-500 hover:text-rose-700 hover:bg-rose-50 dark:hover:bg-rose-950 p-1.5 rounded-lg transition"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </td>
                    </tr>`;
            }).join('');
        }
        document.getElementById('depositTotalSum').textContent = sum.toLocaleString('bn-BD');
    }
    function handleAddDeposit(e) {
        e.preventDefault();
        requireAdmin(() => {
            const date = document.getElementById('depositDate').value;
            const memberId = document.getElementById('depositMemberSelect').value;
            const amount = parseFloat(document.getElementById('depositAmount').value) || 0;
            const note = document.getElementById('depositNote').value.trim();
            if (amount <= 0) { showToast('সঠিক পরিমাণ দিন', 'error'); return; }
            depositData.push({ id: 'd_' + Date.now(), date, memberId, amount, note });
            pushDataToFirebase();
            document.getElementById('depositAmount').value = '';
            document.getElementById('depositNote').value = '';
            renderAll();
            showToast('জমা সেভ!');
        });
    }
    function openEditDepositModal(id) {
        const deposit = depositData.find(d => d.id === id);
        if (!deposit) return;
        document.getElementById('editDepositId').value = deposit.id;
        document.getElementById('editDepositDate').value = deposit.date;
        document.getElementById('editDepositMemberSelect').value = deposit.memberId;
        document.getElementById('editDepositAmount').value = deposit.amount;
        document.getElementById('editDepositNote').value = deposit.note || '';
        document.getElementById('editDepositModal').classList.remove('hidden');
    }
    function closeEditDepositModal() { document.getElementById('editDepositModal').classList.add('hidden'); }
    function saveEditDeposit() {
        const id = document.getElementById('editDepositId').value;
        const date = document.getElementById('editDepositDate').value;
        const memberId = document.getElementById('editDepositMemberSelect').value;
        const amount = parseFloat(document.getElementById('editDepositAmount').value) || 0;
        const note = document.getElementById('editDepositNote').value.trim();
        if (amount <= 0) { showToast('সঠিক পরিমাণ দিন', 'error'); return; }
        const deposit = depositData.find(d => d.id === id);
        if (deposit) {
            deposit.date = date; deposit.memberId = memberId;
            deposit.amount = amount; deposit.note = note;
            pushDataToFirebase();
            closeEditDepositModal();
            renderAll();
            showToast('আপডেট!');
        }
    }
    function deleteDeposit(id) {
        if (confirm('ডিলিট করবেন?')) {
            depositData = depositData.filter(d => d.id !== id);
            pushDataToFirebase();
            renderAll();
            showToast('ডিলিট');
        }
    }

    // BAZAR
    function renderBazarTab() {
        const select = document.getElementById('bazarMemberSelect');
        if (select) select.innerHTML = members.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
        const currentBazar = bazarData.filter(item => item.date && item.date.startsWith(selectedMonth));
        const listTable = document.getElementById('bazarListTable');
        let sum = 0;
        if (currentBazar.length === 0) {
            listTable.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">এই মাসে কোনো বাজার নেই</td></tr>`;
        } else {
            listTable.innerHTML = currentBazar.map(item => {
                const member = members.find(m => m.id === item.memberId) || { name: 'অজানা' };
                sum += Number(item.amount) || 0;
                const catText = item.category || 'বাজার';
                const isGas = catText.includes('গ্যাস') || catText.includes('Gas');
                return `
                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition">
                        <td class="p-3 font-medium text-slate-700 dark:text-slate-300">${item.date}</td>
                        <td class="p-3 font-semibold text-slate-800 dark:text-slate-100">${member.name}</td>
                        <td class="p-3">
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${isGas ? 'bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 border border-amber-300 dark:border-amber-800' : 'bg-slate-100 dark:bg-slate-800 text-indigo-700 dark:text-indigo-300 border border-slate-200 dark:border-slate-700'}">${catText}</span>
                        </td>
                        <td class="p-3 text-slate-600 dark:text-slate-400">${item.note || '-'}</td>
                        <td class="p-3 font-bold text-rose-600 dark:text-rose-400 text-right">৳${Number(item.amount).toLocaleString('bn-BD')}</td>
                        <td class="p-3 text-center">
                            <button onclick="requireAdmin(() => deleteBazar('${item.id}'))" class="text-rose-500 hover:text-rose-700 p-1"><i class="fa-solid fa-trash-can"></i></button>
                        </td>
                    </tr>`;
            }).join('');
        }
        document.getElementById('bazarTotalSum').textContent = sum.toLocaleString('bn-BD');
    }
    function handleAddBazar(e) {
        e.preventDefault();
        requireAdmin(() => {
            const date = document.getElementById('bazarDate').value;
            const memberId = document.getElementById('bazarMemberSelect').value;
            const category = document.getElementById('bazarCategory').value.trim() || 'বাজার';
            const amount = parseFloat(document.getElementById('bazarAmount').value) || 0;
            const note = document.getElementById('bazarNote').value.trim();
            if (amount <= 0) { showToast('সঠিক পরিমাণ দিন', 'error'); return; }
            bazarData.push({ id: 'b_' + Date.now(), date, memberId, category, amount, note });
            pushDataToFirebase();
            document.getElementById('bazarAmount').value = '';
            document.getElementById('bazarNote').value = '';
            renderAll();
            showToast('বাজার সেভ!');
        });
    }
    function deleteBazar(id) {
        bazarData = bazarData.filter(b => b.id !== id);
        pushDataToFirebase();
        renderAll();
        showToast('ডিলিট');
    }

    // SUMMARY
    function renderSummaryTab() {
        const stats = calculateStats();
        const tbody = document.getElementById('summaryTableBody');
        if (members.length === 0) { tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">কোনো মেম্বার নেই</td></tr>`; return; }
        tbody.innerHTML = members.map(m => {
            const totalMeals = stats.memberMealTotals[m.id] || 0;
            const mealCost = totalMeals * stats.mealRate;
            const totalDeposit = stats.memberDepositTotals[m.id] || 0;
            const finalBalance = totalDeposit - mealCost;
            const isPlus = finalBalance >= 0;
            return `
                <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40 font-medium">
                    <td class="p-3.5 font-semibold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                        <div class="w-6 h-6 rounded-full ${m.color || 'bg-indigo-600'} text-white font-bold flex items-center justify-center text-[10px]">${(m.name||'?').trim().charAt(0)}</div>
                        <span>${m.name}</span>
                    </td>
                    <td class="p-3.5 text-center text-slate-700 dark:text-slate-300 font-bold">${totalMeals.toFixed(2)}</td>
                    <td class="p-3.5 text-right text-rose-600 dark:text-rose-400 font-medium">৳${mealCost.toFixed(1)}</td>
                    <td class="p-3.5 text-right text-emerald-600 dark:text-emerald-400 font-bold">৳${totalDeposit}</td>
                    <td class="p-3.5 text-right font-bold text-xs ${isPlus ? 'bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300' : 'bg-rose-50 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300'}">
                        ${isPlus ? 'পাবে: +' : 'দিবে: '}৳${Math.abs(finalBalance).toFixed(1)}
                    </td>
                </tr>`;
        }).join('');
    }

    // CSV
    function exportToCSV() {
        const stats = calculateStats();
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += `Mess: ${messDetails.name} (${currentMessId})\nMonth: ${getBengaliMonthYear(selectedMonth)}\n\n`;
        csvContent += `Member,Total Meals,Meal Cost (BDT),Total Deposit (BDT),Final Balance (BDT)\n`;
        members.forEach(m => {
            const totalMeals = stats.memberMealTotals[m.id] || 0;
            const mealCost = (totalMeals * stats.mealRate).toFixed(1);
            const totalDeposit = stats.memberDepositTotals[m.id] || 0;
            const finalBalance = (totalDeposit - mealCost).toFixed(1);
            csvContent += `"${m.name}",${totalMeals},${mealCost},${totalDeposit},${finalBalance}\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Mess_${currentMessId}_${selectedMonth}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('CSV ডাউনলোড!');
    }

    // TOAST
    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        const toastIcon = document.getElementById('toastIcon');
        toastMsg.textContent = msg;
        if (type === 'error') toastIcon.className = "fa-solid fa-circle-xmark text-rose-400 text-base";
        else if (type === 'info') toastIcon.className = "fa-solid fa-circle-info text-amber-400 text-base";
        else toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-base";
        toast.classList.add('toast-show');
        setTimeout(() => toast.classList.remove('toast-show'), 3000);
    }
</script>
